spring.application.name=users

# Loads a local .env file (KEY=VALUE) when present; real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=dev

google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

spring.jpa.open-in-view=false
